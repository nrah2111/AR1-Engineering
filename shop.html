<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สินค้าทั้งหมด — ARONE Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
  .filters button{padding:9px 18px;border-radius:30px;border:1.5px solid #d5d9df;background:#fff;
    font-family:var(--font);font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.2s}
  .filters button.active,.filters button:hover{background:var(--steel-800);color:#fff;border-color:var(--steel-800)}
  .filters button b{opacity:.6;font-weight:700}
  .filters-sub{margin-top:-20px;margin-bottom:22px}
  .filters-sub button{padding:6px 14px;font-size:13px;border-radius:6px;border-color:#e3e6ea}
  .filters-sub button.active,.filters-sub button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div id="header"></div>
<section class="pagehead">
  <div class="container">
    <h1>สินค้าทั้งหมด</h1>
    <p>หัวสายไฮดรอลิค (Hose Fitting) — ครบทุกขนาด พร้อมรหัสรุ่นและสเปก</p>
  </div>
</section>
<div class="crumb"><div class="container"><a href="index.html">หน้าแรก</a> / <span>สินค้าทั้งหมด</span></div></div>

<section class="section">
  <div class="container">
    <div class="eyebrow">Our Products</div>
    <h2>สินค้าทั้งหมด</h2>
    <div class="searchbox">
      <span class="si">🔍</span>
      <input type="text" id="q" autocomplete="off"
             placeholder="พิมพ์ชื่อสินค้า หรือรหัสรุ่น เช่น GJS-0404, หัวสาย, Brass-tone…" aria-label="ค้นหาสินค้า">
      <button type="button" id="qclear" aria-label="ล้างคำค้นหา">✕</button>
    </div>
    <div class="quick-tags" id="quick"></div>

    <div class="active-filters" id="chips"></div>
    <div class="filters" id="filters"></div>
    <div class="filters filters-sub" id="shapes"></div>
    <p class="center" id="count" style="color:var(--muted);font-size:14px;margin-bottom:22px"></p>
    <div class="prod-grid" id="grid"></div>
  </div>
</section>

<div id="footer"></div>
<script src="assets/products.js"></script>
<script src="assets/app.js"></script>
<script>
  document.getElementById("header").innerHTML = AR1_header("shop.html");
  document.getElementById("footer").innerHTML = AR1_footer();

  const params = new URLSearchParams(location.search);
  let current = params.get("cat") || "all";
  let query = (params.get("q")||"").trim().toLowerCase();

  let shape  = params.get("shape")  || "all";
  let thread = params.get("thread") || "all";
  const cats = [["all","ทั้งหมด"], ...AR1_CATEGORIES.map(c=>[c.id,c.name])];
  const chipsEl   = document.getElementById("chips");
  const filtersEl = document.getElementById("filters");
  const shapesEl  = document.getElementById("shapes");
  const countEl   = document.getElementById("count");
  const gridEl    = document.getElementById("grid");

  const qEl = document.getElementById("q");
  const quickEl = document.getElementById("quick");
  qEl.value = params.get("q") || "";

  // every search term must appear somewhere in the product -> "jm 90" matches JM-BMT-90
  function matchQ(p){
    if(!query) return true;
    const hay = (p.name+" "+p.id+" "+p.lead+" "+(p.shapeName||"")+" "+
                 Object.values(p.specs).join(" ")).toLowerCase();
    return query.split(/\s+/).every(term => hay.includes(term));
  }

  function render(){
    // family buttons
    filtersEl.innerHTML = cats.map(([id,name])=>{
      const n = id==="all" ? AR1_PRODUCTS.length : AR1_PRODUCTS.filter(p=>p.cat===id).length;
      return `<button class="${current===id?'active':''}" data-c="${id}">${name} <b>${n}</b></button>`;
    }).join("");

    // family + thread narrow the pool; shape buttons are scoped to what's left
    const inFam = AR1_PRODUCTS
      .filter(p=>current==="all"||p.cat===current)
      .filter(p=>thread==="all"||(p.threads||[]).includes(thread));
    const shapes = [];
    inFam.forEach(p=>{ if(p.shape && !shapes.some(s=>s[0]===p.shape)) shapes.push([p.shape,p.shapeName]); });
    shapesEl.innerHTML = shapes.length>1
      ? [["all","ทุกรูปแบบ"],...shapes].map(([id,name])=>
          `<button class="${shape===id?'active':''}" data-s="${id}">${name}</button>`).join("")
      : "";

    // removable chips for filters arrived at from the category page
    const chips=[];
    if(thread!=="all"){
      const t=AR1_THREADS.find(x=>x.id===thread);
      chips.push(`<span class="chip">ระบบเกลียว: ${t?t.name:thread}<button data-x="thread">✕</button></span>`);
    }
    if(shape!=="all" && !shapes.some(s=>s[0]===shape)){ shape="all"; }
    if(shape!=="all"){
      const s=shapes.find(x=>x[0]===shape);
      chips.push(`<span class="chip">รูปแบบ: ${s?s[1]:shape}<button data-x="shape">✕</button></span>`);
    }
    chipsEl.innerHTML = chips.join("");
    chipsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      if(b.dataset.x==="thread") thread="all"; else shape="all"; render();
    });

    const list = inFam.filter(p=>shape==="all"||p.shape===shape).filter(matchQ);

    countEl.innerHTML = query
      ? `พบ <b>${list.length}</b> รายการสำหรับ “${qEl.value.trim()}”`
      : `แสดง ${list.length} รายการ`;

    gridEl.innerHTML = list.map(p=>{
      let html = AR1_card(p);
      if(query){                                  // highlight the matched code
        query.split(/\s+/).forEach(t=>{
          html = html.replace(new RegExp(`(>[^<]*?)(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),
                              '$1<mark>$2</mark>');
        });
      }
      return html;
    }).join("") ||
      `<div class='noresult'>
         <div class='big'>🔍</div>
         <p>ไม่พบสินค้าที่ตรงกับ “${qEl.value.trim()}”</p>
         <p class='hint'>ลองค้นด้วยรหัสรุ่น เช่น <b>GJS-0404</b> หรือผิวเคลือบ เช่น <b>Brass-tone</b></p>
         <button class="btn btn-view" onclick="AR1_clearAll()">ล้างตัวกรองทั้งหมด</button>
       </div>`;

    filtersEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.c;shape="all";render();});
    shapesEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{shape=b.dataset.s;render();});
    document.querySelector(".searchbox").classList.toggle("has-q", !!query);
  }

  // ---- live search: filters as you type ----
  let timer;
  qEl.addEventListener("input", ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{ query = qEl.value.trim().toLowerCase(); render(); }, 120);
  });
  qEl.addEventListener("keydown", e=>{ if(e.key==="Escape") AR1_reset(); });
  document.getElementById("qclear").onclick = ()=>AR1_reset();
  window.AR1_reset = function(){ qEl.value=""; query=""; qEl.focus(); render(); };
  window.AR1_clearAll = function(){ qEl.value=""; query=""; current="all"; shape="all"; thread="all"; render(); };

  // quick tags — one tap to a popular search
  const QUICK = ["GJS-0404","GJS-0808","GJS-1616","Brass-tone","Silver-tone","หัวสาย"];
  quickEl.innerHTML = `<span>ค้นหายอดนิยม:</span>` +
    QUICK.map(t=>`<button data-q="${t}">${t}</button>`).join("");
  quickEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    qEl.value=b.dataset.q; query=b.dataset.q.toLowerCase();
    current="all"; shape="all"; render();
    document.querySelector(".searchbox").scrollIntoView({behavior:"smooth",block:"center"});
  });

  render();
</script>
</body>
</html>
